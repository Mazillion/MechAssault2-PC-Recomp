name: Bug report
description: Something does not work in the installer, the game or the scenario editor.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Attach logs only.** Never attach or link game files, disc images, extracted
        assets, texture packs or the game exe: such issues are deleted. Requests for the game are closed.
  - type: dropdown
    id: area
    attributes:
      label: Where
      options: [Installer, Game - campaign, Game - bot match, Game - menus / settings / input, Scenario editor, Enhanced textures / videos, Other]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown on the installer's first page, in the game's title screen, or in recomp-install.json in the install folder.
      placeholder: "1.1.7"
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead. For bot or campaign problems, the map / mission and roughly when.
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        1. Use **Report a problem**: in the game's pause menu, in the Start menu, or in the installer (Help menu, or the
           failure screen). It makes one zip with the game and installer logs, your settings and basic PC facts, with
           your Windows user name and PC name removed. If it says *Report sent*, paste the report number here;
           otherwise it saved the zip in `%LOCALAPPDATA%\MechAssault2\Diagnostics`: drag that zip in here.
        2. Versions before 1.1.6: run the installer and press **Collect diagnostics** (command line: `--diagnostics`).
        - Crash or freeze: a report from the crash or freeze window includes the dump, with names overwritten.
        - Bot problems: a maintainer may ask for a bot recording; the Bots guide in your install explains how.
        - Attach the report zip, not raw `.log` files.
    validations: { required: true }
  - type: input
    id: system
    attributes:
      label: System
      description: Windows version, graphics card and driver version, RAM.
      placeholder: "Windows 11 24H2, RTX 3070 driver 572.16, 32 GB"
    validations: { required: true }
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I own the US (NTSC) retail MechAssault 2 disc this was built from.
          required: true
        - label: I attached logs only, no game files.
          required: true
