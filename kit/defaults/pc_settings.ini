; MechAssault 2 first-launch settings. On first launch this file is copied to
; %LOCALAPPDATA%\MechAssault2\pc_settings.ini; the game then reads and saves that copy.
; Everything here is also in the game's own Player Options pages.

[Display]
; Window size, and the scene's rendering resolution in both window modes.
WindowWidth=1280
WindowHeight=960
Fullscreen=0
; 1 = Automatic: wider camera for widescreen/ultrawide. 0 = original 4:3 with side bars.
PreserveAspect=1
SmoothScaling=1
VSync=0
; Frames per second, 30 to 360 (default 144). There is no unlimited setting: an old 0 is read as 144.
FrameLimit=144
ShowFPS=0
; 0..100 scales level fog and camera range together: 50 is original, 100 twice as far.
DrawDistance=50
; 0 = Original, 1 = 2x Enhanced, 2 = 4x Enhanced (only the packs that were installed).
TextureQuality=0
; 0 = Original cutscenes, 1 = 2x Enhanced (if installed).
FMVQuality=0
; 1 = create each level's recorded shaders while it loads (fewer first-time hitches).
PreloadShaders=1
; Story cutscenes: 2 = fill the screen (default), 1 = fill up to 16:9, 0 = original 4:3 with side bars,
; 3 = wide. Filling needs PreserveAspect=1.
CinematicView=2
; Cutscene frame rate (default 60; 0 = use FrameLimit). Above about 100 some scripted movement goes wrong.
CinematicFrameCap=60

[Input]
Keyboard=1
; pc or legacy. See Controls.txt for the keys.
KeyboardLayout=pc
MouseAim=1
MouseSensitivity=100
InvertY=0
InvertFlight=0
; 1 = two movement keys together (W+D) run at the same speed as one, like a real stick. 0 = the old faster diagonal.
DiagonalNormalise=1
; 1 = pause play while another window has focus (0 = keep running).
PauseOnFocusLoss=1

[Audio]
Enabled=1
Volume=100
; 1 = silence the game while another window has focus (0 = keep the sound on).
MuteInBackground=1

; Key bindings are not listed here: the game fills in layout-correct defaults (WASD follows the
; physical key positions) and writes a [Bindings] section to your own pc_settings.ini the first
; time it saves your settings.

[Bots]
; Offline bots: counts and skill are set on the New Game screen (Multiplayer > Bot Match).
; BotRecorder=1 writes a flight record of each bot match to the Logs folder (newest 4 kept,
; at most 150 MB each, so up to 600 MB). Off by default; turn it on only if a maintainer asks.
BotRecorder=0

[Update]
; 1 = once per launch the game asks the project's server for the newest version number and, if there is a
; newer one, shows one line on the main menu. Only the game's version number is sent. 0 = never ask.
CheckForUpdates=1
