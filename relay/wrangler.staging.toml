# Staging relay: separate Worker, bucket and GitHub repo, used for test runs only.
# Deploy: npx wrangler deploy -c wrangler.staging.toml
# Secrets: npx wrangler secret put GITHUB_TOKEN -c wrangler.staging.toml ; same for OWNER_KEY
name = "ma2-report-relay-staging"
main = "src/worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

[observability]
enabled = false

[vars]
GITHUB_REPO = "Mazillion/MechAssault2-Reports-Staging"
PUBLIC_URL = "https://ma2-report-relay-staging.ma2-relay.workers.dev"
ACCEPT_REPORTS = "on"
OFF_MESSAGE = ""
NOTICE = ""
# Newest release. Normally set with `python tools/triage.py announce X.Y.Z --installer <file>` (stored in the bucket as
# config/latest.json, no redeploy); these vars are used only while nothing was announced. LATEST_SHA256 / LATEST_SIZE:
# the release installer's SHA-256 (64 hex) and size in bytes; the self-updating installer runs a download only when
# both match.
LATEST_VERSION = ""
LATEST_SHA256 = ""
LATEST_SIZE = ""
MIN_VERSION = ""
UPDATE_NOTICE = ""
# Retention (1.1.7): reports and their issues go after 60 days (hourly cron). The player's own text stays out of
# issues ("on" = put it in, as in 1.1.6; GitHub then keeps it in the issue's edit history after the clean-up).
ISSUE_PLAYER_TEXT = "off"
# "on" = try to delete old issues outright (needs a token with admin rights on the reports repo); otherwise, or
# when that is refused, they are emptied, closed and locked.
DELETE_ISSUES = "on"
# Small limits so the limit tests finish quickly.
DAILY_CAP = "20"
PER_IP_PER_HOUR = "5"
MAX_UPLOAD_BYTES = "26214400"

[[r2_buckets]]
binding = "REPORTS"
bucket_name = "ma2-reports-staging"

[[durable_objects.bindings]]
name = "GATE"
class_name = "Gate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Gate"]

[triggers]
crons = ["23 * * * *"]
