# Production relay. Deploy: npx wrangler deploy            (staging: npx wrangler deploy -c wrangler.staging.toml)
# Secrets (never in this file): npx wrangler secret put GITHUB_TOKEN ; npx wrangler secret put OWNER_KEY
name = "ma2-report-relay"
main = "src/worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

# Workers Logs would keep request details (including the connecting IP). Keep it off.
[observability]
enabled = false

[vars]
GITHUB_REPO = "Mazillion/MechAssault2-Reports"
# Fill in after the first deploy, e.g. "https://ma2-report-relay.<your-subdomain>.workers.dev"
PUBLIC_URL = "https://ma2-report-relay.ma2-relay.workers.dev"
# Off switch: "off" makes every upload answer ok:false (clients save the report locally instead).
ACCEPT_REPORTS = "on"
OFF_MESSAGE = ""
# Text shown to players after a successful send ("" = nothing extra).
NOTICE = ""
# Optional: players on a version below LATEST_VERSION see UPDATE_NOTICE; below MIN_VERSION their report is refused.
# Newest release. Normally set with `python tools/triage.py announce X.Y.Z --installer <file>` (stored in the bucket as
# config/latest.json, no redeploy); these vars are used only while nothing was announced. LATEST_SHA256 / LATEST_SIZE:
# the release installer's SHA-256 (64 hex) and size in bytes; the self-updating installer runs a download only when
# both match.
LATEST_VERSION = ""
LATEST_SHA256 = ""
LATEST_SIZE = ""
MIN_VERSION = ""
UPDATE_NOTICE = ""
# Retention (1.1.7): reports and their issues go after 60 days (hourly cron). The player's own text stays out of
# issues ("on" = put it in, as in 1.1.6; GitHub then keeps it in the issue's edit history after the clean-up).
ISSUE_PLAYER_TEXT = "off"
# "on" = try to delete old issues outright (needs a token with admin rights on the reports repo); otherwise, or
# when that is refused, they are emptied, closed and locked.
DELETE_ISSUES = "on"
DAILY_CAP = "300"
PER_IP_PER_HOUR = "5"
MAX_UPLOAD_BYTES = "26214400"
# 1.2.0 report conversations: reply checks (POST /v1/replies) per connection per hour. Answers use the report limits.
REPLY_POLLS_PER_HOUR = "30"

[[r2_buckets]]
binding = "REPORTS"
bucket_name = "ma2-reports"

[[durable_objects.bindings]]
name = "GATE"
class_name = "Gate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Gate"]

# Retry issues that could not be opened (GitHub down, token expired): every hour at :23.
[triggers]
crons = ["23 * * * *"]
